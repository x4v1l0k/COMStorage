; COMStorage PoC — LILYGO TTGO T-Dongle-S3
; USB CDC/Serial ONLY. USB Mass Storage (MSC) is intentionally NOT enabled.

[platformio]
default_envs = t-dongle-s3
description = COMStorage USB CDC filesystem PoC

[env:t-dongle-s3]
platform = espressif32@6.12.0
framework = arduino
board = esp32-s3-devkitc-1

board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.arduino.memory_type = qio_qspi
board_upload.maximum_size = 16777216

; Hardware USB CDC/JTAG on ESP32-S3 native USB.
; Serial maps to CDC. Do NOT enable USB MSC / TinyUSB MSC.
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DCORE_DEBUG_LEVEL=1
	-DCOMSTORAGE_DEVICE_NAME=\"TTGO-T-Dongle-S3\"
	-DCOMSTORAGE_PROTOCOL_VERSION=\"1.0\"
	-DCOMSTORAGE_MAX_PATH=200
	-DCOMSTORAGE_MAX_FILE_SIZE=536870912
	-DCOMSTORAGE_CHUNK_SIZE=4096
	-DCOMSTORAGE_CMD_TIMEOUT_MS=30000
	-DCOMSTORAGE_RX_LINE_MAX=512
	-DCOMSTORAGE_FORMAT_TIMEOUT_MS=180000

monitor_speed = 115200
monitor_rts = 0
monitor_dtr = 0
upload_speed = 921600

lib_deps =
	bblanchon/ArduinoJson@^7.2.1
	adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
	adafruit/Adafruit GFX Library@^1.11.11
	adafruit/Adafruit BusIO@^1.16.1

[env:t-dongle-s3-sd]
extends = env:t-dongle-s3
; Alias: SD is already the default storage backend.
